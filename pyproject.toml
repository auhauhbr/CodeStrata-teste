[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codestrata"
version = "0.1.0"
description = "Reconstruct technology timelines from Git history and archived websites."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jefferson Santos" }]
keywords = ["git", "archaeology", "technology", "timeline", "static-analysis", "github", "wayback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
codestrata = "codestrata.cli:main"

[project.urls]
Homepage = "https://github.com/JeffersonSantosKn/CodeStrata"
Repository = "https://github.com/JeffersonSantosKn/CodeStrata"
Issues = "https://github.com/JeffersonSantosKn/CodeStrata/issues"

[tool.setuptools.packages.find]
where = ["src"]
