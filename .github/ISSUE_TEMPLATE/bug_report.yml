name: Bug report
description: Report an incorrect detection, crash, or regression
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command you ran and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant repository evidence
      description: Manifest entries, file names, or source patterns that triggered the issue. Remove secrets.
  - type: input
    id: version
    attributes:
      label: CodeStrata version
      placeholder: "0.1.0"
